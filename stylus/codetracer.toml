# Stylus host-module configuration consumed by the M27 generic
# WASM host-module instrumentation framework
# (codetracer-wasm-host-module-framework).
#
# Replaces the hard-coded `vm_hooks` host stubs that used to live in
# codetracer-wasm-recorder/internal/stylus/ (stylus.go,
# stylus_funcs.go). The framework reads this TOML at recorder
# start-up, builds a PassThroughPlan, and the embedder (wazero
# recorder, wasmtime, browser host) generates one pass-through stub
# per [[function]] entry. Every crossing emits a CodeTracer
# tracewriter event named `<module>.<function>` plus an M25
# correlation marker keyed by the WASM arguments — exactly the
# behaviour the old hand-written Go file used to encode.
#
# The list of imports + their signatures mirrors the Stylus
# (Arbitrum WASM) hostio surface published by the
# `stylus-sdk-rs` runtime; signatures were verified against the
# legacy stylus_funcs.go implementation that the M28 migration
# retires.
#
# Spec: codetracer-specs/Planned-Features/Value-Origin-Tracking.milestones.org § M28
# Framework: codetracer-wasm-instrumenter/crates/codetracer-wasm-host-module-framework
# Legacy code being retired:
#   codetracer-wasm-recorder/internal/stylus/stylus.go
#   codetracer-wasm-recorder/internal/stylus/stylus_funcs.go
#   codetracer-wasm-recorder/internal/stylus/stylus_trace.go

[host_module]
# The wazero-side host module name the Stylus runtime imports from.
# Documented in the stylus-sdk source (lib/host.rs) and pinned by
# the on-chain ABI.
name = "vm_hooks"

# Surface every crossing to the M25 correlation index. Each
# `[[function]]` entry receives a boundary_id of `vm_hooks.<name>`
# automatically.
auto_correlation_markers = true

# EVM sysroot lookup hint used by the recorder to locate
# debug-built contract WASM by transaction hash. Mirrors the
# convention already documented in
# codetracer/src/ct/stylus/record.nim — see § "ct arb record"
# in the user manual.
[sysroot]
contract_debug_wasm_dir = "$XDG_DATA_HOME/codetracer/contract-debug-wasm"
evm_trace_format = "cargo-stylus-native-tracer-v1"

# Mapping from a host-import name to the tracewriter event kind the
# framework records. The default is `EvmEvent` (kind 13). Anything
# that is purely informational (gas/ink counters, blocknum, etc.)
# could downgrade to a different kind; for V1 every Stylus crossing
# rides as EvmEvent for byte-for-byte parity with the legacy
# fixture (see trace.events.json — every entry there records
# Event.kind = 13).
[event_kinds]
default = "EvmEvent"

