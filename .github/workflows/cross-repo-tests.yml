# Cross-Repo Integration Tests
#
# Validates that changes to this recorder do not break the CodeTracer VS Code
# extension's Solidity DAP and GUI tests.
#
# Workspace layout (sibling repos cloned alongside this checkout):
#   $GITHUB_WORKSPACE/$EVM_CI_NAMESPACE/
#     codetracer-evm-recorder/                      <-- this repo (checked out)
#     codetracer/                    <-- cloned (for ct binary)
#     codetracer-vscode-extension/   <-- cloned (test harness + fixtures)

name: Cross-Repo Integration Tests

on:
  pull_request:
    branches: [main, dev, stable]
  push:
    branches: [main, dev, stable]

  workflow_dispatch:
    inputs:
      codetracer_ref:
        description: "Git ref for codetracer repo"
        required: false
        default: ""
      vscode_extension_ref:
        description: "Git ref for codetracer-vscode-extension repo"
        required: false
        default: ""

  repository_dispatch:
    types: [cross-repo-test]

# Cancel superseded PR runs only: a new push to a PR makes its previous run
# moot, and stale runs otherwise hold scarce self-hosted runners. Every other
# event (mainline push, merge_group, tag, dispatch, schedule) gets a group
# unique to its run_id, so it is never cancelled and never cancels anything.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  wdio-integration:
    runs-on: [self-hosted, nixos]

    env:
      EVM_CI_NAMESPACE: evm-ci-${{ github.run_id }}-${{ github.run_attempt }}-wdio-linux-x64
    steps:
      - name: Generate CI token
        id: app-token
        uses: actions/create-github-app-token@v1
        with:
          app-id: ${{ secrets.CI_TOKEN_PROVIDER_APP_ID }}
          private-key: ${{ secrets.CI_TOKEN_PROVIDER_PRIVATE_KEY }}
          owner: metacraft-labs

      - name: Configure NIX_CONFIG with access-tokens
        # The original top-level ``env: NIX_CONFIG`` block referenced
        # ``steps.app-token.outputs.token`` -- but the ``steps`` context
        # is unavailable at workflow level (the new GitHub Actions
        # validator rejects the file before any job starts).  Set
        # ``NIX_CONFIG`` via ``$GITHUB_ENV`` from a step that runs
        # AFTER ``app-token`` so subsequent ``nix develop`` invocations
        # can still fetch private flake inputs.
        run: |
          {
            echo 'NIX_CONFIG<<NIX_EOF'
            echo "access-tokens = github.com=${{ steps.app-token.outputs.token }}"
            echo 'accept-flake-config = true'
            echo 'NIX_EOF'
          } >> "$GITHUB_ENV"

      - name: Checkout
        uses: actions/checkout@v4
        with:
          path: evm-ci-bootstrap

      - name: Setup declared Nix before shell activation
        uses: metacraft-labs/metacraft-github-actions/setup-nix@3fcbb26dd920adf6ccc64a87c6d24797ab0b5d94
        with:
          substituters: ${{ vars.SUBSTITUTERS }}
          trusted-public-keys: ${{ vars.TRUSTED_PUBLIC_KEYS }}
          gh-token: ${{ steps.app-token.outputs.token }}

      - name: Create declared Git exact-event checkout
        working-directory: evm-ci-bootstrap
        shell: bash
        run: |
          nix run .#prepare-ci-checkout -- "$PWD" "$GITHUB_WORKSPACE/$EVM_CI_NAMESPACE/codetracer-evm-recorder" "${{ github.sha }}" "$GITHUB_WORKSPACE/$EVM_CI_NAMESPACE" "$EVM_CI_NAMESPACE"

      - name: Create locked decoder peer with its declared Git templates
        working-directory: evm-ci-bootstrap
        shell: bash
        run: |
          nix run .#prepare-ci-trace-nim-peer -- "$GITHUB_WORKSPACE/$EVM_CI_NAMESPACE/codetracer-evm-recorder"

      - name: Setup dev env
        # Installs nix and clones the cross-repo siblings adjacent to this
        # checkout at workspace-lock-pinned revisions. workflow_dispatch /
        # repository_dispatch ref inputs override the locked revision for
        # codetracer + the extension (empty => lock).
        uses: metacraft-labs/metacraft-github-actions/setup-dev-env@a515a0a1ed7917688345138d15f2210b53a6c694
        with:
          env-flavor: nix
          consumer-directory: ${{ env.EVM_CI_NAMESPACE }}/codetracer-evm-recorder
          workspace-directory: ${{ env.EVM_CI_NAMESPACE }}
          gh-token: ${{ steps.app-token.outputs.token }}
          substituters: ${{ vars.SUBSTITUTERS }}
          trusted-public-keys: ${{ vars.TRUSTED_PUBLIC_KEYS }}
          attic-token: ${{ secrets.ATTIC_TOKEN }}
          attic-cache: ${{ vars.ATTIC_CACHE }}
          attic-endpoint: ${{ vars.ATTIC_ENDPOINT }}
          siblings: |
            codetracer=${{ github.event.inputs.codetracer_ref || github.event.client_payload.codetracer_ref }}
            codetracer-vscode-extension=${{ github.event.inputs.vscode_extension_ref || github.event.client_payload.vscode_extension_ref }}
            codetracer-trace-format
            codetracer-trace-format-nim

      - name: Provide codetracer-trace-format into codetracer/libs (CI override)
        # The codetracer Build step below uses
        # ``--override-input codetracer-trace-format
        # path:./libs/codetracer-trace-format``.  The codetracer
        # checkout doesn't ship that directory, so we copy the
        # sibling (already cloned at the lock-pinned revision by
        # setup-dev-env) into the expected path before nix build.
        run: |
          SRC="$GITHUB_WORKSPACE/$EVM_CI_NAMESPACE/codetracer-trace-format"
          DEST="$GITHUB_WORKSPACE/$EVM_CI_NAMESPACE/codetracer/libs/codetracer-trace-format"
          rm -rf "$DEST"
          cp -a "$SRC" "$DEST"

      - name: Fetch the dev shells later steps enter, while the token is valid
        # The job's one GitHub token expires an hour after "Generate CI token"
        # minted it, and a job mints exactly once, so it cannot be refreshed.
        # Nix keeps presenting it, and GitHub answers `401 Bad credentials`
        # for every fetch nix has not cached. "Build codetracer" below takes
        # about an hour, so the steps after it start with a dead token.
        # PR #17 job 130769541203: minted 21:08:10, and at 22:16:31 "Record
        # Solidity trace fixture" failed fetching the private
        # reprobuild-ct-test-runner tarball, an input of the reprobuild
        # package this recorder's dev shell carries.
        #
        # Evaluating each dev shell here does every authenticated fetch while
        # the token works; the later `nix develop` of the same locked revision
        # is answered from nix's fetcher cache under this job's $HOME. This is
        # the fix codetracer's launcher-recorder-e2e.yml and
        # codetracer-wasm-recorder's cross-repo job apply. Evaluation only:
        # nothing is built.
        run: |
          set -euo pipefail
          SYSTEM="$(nix eval --impure --raw --expr builtins.currentSystem)"
          for dir in codetracer-evm-recorder codetracer-vscode-extension; do
            (cd "$GITHUB_WORKSPACE/$EVM_CI_NAMESPACE/$dir" &&
              nix eval --raw --no-write-lock-file ".#devShells.${SYSTEM}.default.drvPath" >/dev/null) || {
              echo "::error::could not evaluate the dev shell of ${dir} while this job's GitHub token is still valid; a later step enters it after the token has expired"
              exit 1
            }
          done

      - name: Build codetracer
        run: |
          cd "$GITHUB_WORKSPACE/$EVM_CI_NAMESPACE/codetracer"
          # Override BOTH trace-format AND trace-format-nim against the
          # workflow-cloned siblings so the Rust wrapper and the Nim FFI
          # advance together.  Without the -nim override, codetracer's
          # flake.lock pins a stale trace-format-nim (864cb81, Jun 12)
          # that predates the meta.dat capability flag bits 6+7
          # introduced in f290ff0.  The evm recorder calls
          # ``enable_column_breakpoints_support`` /
          # ``enable_column_motions_support`` which set those bits, but
          # the stale db-backend reader's strict ``KnownFlags`` mask
          # then rejects the trace at meta-parse time with
          # ``meta.dat: unknown flag bits set: 0x00C0``.  The dispatcher
          # falls through to the rr replay-worker path with an empty
          # recreator_exe and ``Command::new("").spawn()`` errors with
          # ``No such file or directory (os error 2)`` -- the symptom
          # the WDIO smoke ``ct/event-load`` request surfaces.  Mirror
          # Solana's fix (a43e8f6).
          OVERRIDE="--override-input codetracer-trace-format path:./libs/codetracer-trace-format \
                    --override-input codetracer-trace-format-nim path:$GITHUB_WORKSPACE/$EVM_CI_NAMESPACE/codetracer-trace-format-nim"
          # Force-skip every non-default substituter so nix fetches
          # the noir source from origin and computes the correct hash
          # itself. cache.nixos.org alone is sufficient for the
          # standard nixpkgs paths in this build.
          SUBST_OVERRIDE="--option accept-flake-config false --option substituters https://cache.nixos.org"
          # The runner's per-user fetcher cache
          # (~/.cache/nix/fetcher-cache-v2.sqlite) holds a stale
          # narinfo for the noir git+https input that contradicts the
          # lockfile.  ``--refresh`` forces nix to re-resolve every
          # flake input from origin even when the local cache has an
          # entry, so the cached narHash gets replaced by what
          # upstream currently serves.
          REFRESH="--refresh"
          nix build $SUBST_OVERRIDE $REFRESH -L ".?submodules=1#codetracer" $OVERRIDE -o result-ct
          nix build $SUBST_OVERRIDE -L ".?submodules=1#db-backend" $OVERRIDE -o result-db
          # Merge both outputs into a single bin directory so the extension
          # can find both ct and db-backend via a single runnablePath.
          mkdir -p combined-bin
          ln -sf "$PWD"/result-ct/bin/* combined-bin/
          ln -sf "$PWD"/result-db/bin/* combined-bin/
          echo "$PWD/combined-bin" >> "$GITHUB_PATH"

      - name: Install extension dependencies
        run: |
          cd "$GITHUB_WORKSPACE/$EVM_CI_NAMESPACE/codetracer-vscode-extension"
          nix develop -c just install

      - name: Compile extension TypeScript
        run: |
          cd "$GITHUB_WORKSPACE/$EVM_CI_NAMESPACE/codetracer-vscode-extension"
          nix develop -c just compile-ts

      - name: Restore Nim-compiled ct_vscode.js
        run: |
          cd "$GITHUB_WORKSPACE/$EVM_CI_NAMESPACE/codetracer-vscode-extension"
          if [ -f media/ct_vscode.js ]; then
            cp media/ct_vscode.js out/ct_vscode.js
          fi

      - name: Patch runnablePath for CI
        run: |
          CT_BIN="$GITHUB_WORKSPACE/$EVM_CI_NAMESPACE/codetracer/combined-bin/ct"
          SETTINGS="$GITHUB_WORKSPACE/$EVM_CI_NAMESPACE/codetracer-vscode-extension/test/wdio/projects/stylus-test/.vscode/settings.json"
          mkdir -p "$(dirname "$SETTINGS")"
          echo "{\"codetracer.runnablePath\": \"$CT_BIN\"}" > "$SETTINGS"
          echo "Patched runnablePath to: $CT_BIN"

      - name: Record Solidity trace fixture
        run: |
          cd "$GITHUB_WORKSPACE/$EVM_CI_NAMESPACE/codetracer-vscode-extension"
          # Strip direnv from PATH so recorder_exec uses 'nix develop' directly.
          # The direnv-nix-flake-overrides plugin overrides NIX_CONFIG, which
          # drops the access-tokens needed for private flake inputs.
          export PATH=$(echo "$PATH" | tr ':' '\n' | grep -v direnv | tr '\n' ':' | sed 's/:$//')
          FORCE=1 nix develop "$GITHUB_WORKSPACE/$EVM_CI_NAMESPACE/codetracer-evm-recorder" -c bash scripts/prepare-solidity-fixture.sh

      - name: Run Solidity smoke tests
        run: |
          cd "$GITHUB_WORKSPACE/$EVM_CI_NAMESPACE/codetracer-vscode-extension"
          nix develop -c just _xvfb-run \
            "npx wdio run wdio.conf.ts --spec test/wdio/specs/smoke/solidity.e2e.ts"

      - name: Run Solidity deep tests
        run: |
          cd "$GITHUB_WORKSPACE/$EVM_CI_NAMESPACE/codetracer-vscode-extension"
          nix develop -c just _xvfb-run \
            "npx wdio run wdio.conf.ts --spec test/wdio/specs/deep/solidity-storage.e2e.ts"

      - name: Collect diagnostics on failure
        if: failure()
        run: |
          EXT_DIAG="$GITHUB_WORKSPACE/$EVM_CI_NAMESPACE/codetracer-vscode-extension/test/wdio/diagnostics"
          if [ -d "$EXT_DIAG" ]; then
            mkdir -p "$GITHUB_WORKSPACE/$EVM_CI_NAMESPACE/wdio-diagnostics"
            cp -r "$EXT_DIAG"/* "$GITHUB_WORKSPACE/$EVM_CI_NAMESPACE/wdio-diagnostics/"
          fi

      - name: Upload diagnostics on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: wdio-solidity-diagnostics
          path: ${{ env.EVM_CI_NAMESPACE }}/wdio-diagnostics/
          retention-days: 7
          if-no-files-found: ignore
