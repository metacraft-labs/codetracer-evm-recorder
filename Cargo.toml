[package]
name = "codetracer-evm-recorder"
version = "0.1.0"
edition = "2024"
authors = ["Metacraft Labs Ltd"]
description = "CodeTracer recorder for EVM smart contracts (Solidity/Vyper)"
license = "Apache-2.0"

[dependencies]
# CodeTracer trace format
codetracer_trace_types = { path = "../codetracer-trace-format/codetracer_trace_types" }
codetracer_trace_writer_nim = { path = "../codetracer-trace-format/codetracer_trace_writer_nim" }

# EVM execution
revm = "34"
revm-inspectors = "0.34"

# State forking for on-chain replay
foundry-fork-db = "0.23"

# Ethereum types and RPC
alloy = { version = "1", features = ["full", "node-bindings"] }

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Async runtime
tokio = { version = "1", features = ["full"] }

# HTTP client (used by source_fetcher.rs to query the Sourcify verified-
# contract API).  Pinned to default-features=false + rustls-tls to avoid
# pulling in OpenSSL on top of the rustls stack alloy already brings in.
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json"] }

# Error handling
eyre = "0.6"

# CLI argument parsing
clap = { version = "4", features = ["derive"] }

# Tempdir used by the Sourcify recompile path to materialise verified
# source files before invoking solc.  Also used in tests, kept as a
# normal dependency so it's available to the lib at runtime.
tempfile = "3"

[dev-dependencies]
# CTFS trace reader used by smoke tests to verify the events emitted by
# the recorder land in the .ct container correctly (CTFS audit, see
# AUDIT-CTFS-2026-05.md).
codetracer_trace_reader = { path = "../codetracer-trace-format/codetracer_trace_reader" }

# Optimise the secp256k1 and Keccak crates in debug builds.
#
# Starting an Anvil node (`src/anvil_node.rs`) runs alloy's
# `Anvil::try_spawn`, which derives a signer and address from each of
# Anvil's ten printed private keys once per banner line it reads after
# them: about 350 secp256k1 scalar multiplications and Keccak hashes per
# start. At opt-level 0 that took 0.4 to 0.7 s of CPU in the test binaries
# and in the debug recorder, several times Anvil's own startup, and it
# counts against alloy's 10 s startup timeout. The Windows CI guest runs
# these tests about ten times slower, four at a time, which puts this work
# alone near 5 s per start; one start there exceeded the timeout.
# Optimised, a start costs 0.1 to 0.2 s here, close to Anvil's own time.
# Release builds are unaffected.
[profile.dev.package.k256]
opt-level = 3

[profile.dev.package.ecdsa]
opt-level = 3

[profile.dev.package.elliptic-curve]
opt-level = 3

[profile.dev.package.primeorder]
opt-level = 3

[profile.dev.package.crypto-bigint]
opt-level = 3

[profile.dev.package.sha3]
opt-level = 3

[profile.dev.package.keccak-asm]
opt-level = 3
